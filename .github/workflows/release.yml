# Releases djangoer when its version (packages/djangoer/pyproject.toml) is not on PyPI yet, once CI
# has passed on main: the commit is tagged `v<version>`, the Studio client is built into the
# package, the wheel and the sdist are built and published with trusted publishing (OIDC, no
# token), and the GitHub release is created with generated notes. Every step skips what is
# already done, so a run that failed part-way is finished by re-running its failed jobs. A manual
# run builds the current ref and publishes it to TestPyPI only.
#
# The wheel is pure Python (`py3-none-any`): the built client is data inside it, so one build
# serves every platform and interpreter.
#
# `workflow_run` is the trigger zizmor warns about because it hands a token to code from a pull
# request when misused; `plan` checks out the commit CI ran on (`head_sha`), only for a `push` to
# main, and only the tag and publish jobs can write, through the API.
name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

env:
  PACKAGE: djangoer

jobs:
  plan:
    name: Plan the release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      unpublished: ${{ steps.plan.outputs.unpublished }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Read the version and ask PyPI
        id: plan
        run: |
          set -euo pipefail
          DIR="packages/$PACKAGE"
          VERSION=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(f"{sys.argv[1]}/pyproject.toml", "rb"))["project"]["version"])' "$DIR")
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          case "$STATUS" in
            200) UNPUBLISHED=false ;;
            404) UNPUBLISHED=true ;;
            *)
              echo "::error::PyPI answered $STATUS for $PACKAGE $VERSION. Check https://status.python.org/ and re-run the workflow"
              exit 1
              ;;
          esac
          # A manual run always builds (for TestPyPI); a release builds only what PyPI does not have.
          BUILD=$UNPUBLISHED
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && BUILD=true
          echo "$PACKAGE $VERSION, unpublished=$UNPUBLISHED, build=$BUILD"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            echo "unpublished=$UNPUBLISHED"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

  tag:
    name: Tag v${{ needs.plan.outputs.version }}
    needs: plan
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          UNPUBLISHED: ${{ needs.plan.outputs.unpublished }}
          HEAD_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$UNPUBLISHED" = "false" ]; then
              echo "::error::$PACKAGE $VERSION is already published, but tag $TAG does not exist. Tag the commit that was published (git tag $TAG <sha> && git push origin $TAG), or bump the version and push again"
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
            echo "created tag $TAG at $HEAD_SHA"
            exit 0
          fi
          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "tag $TAG already points to $HEAD_SHA; skip"
            exit 0
          fi
          if [ "$UNPUBLISHED" = "false" ]; then
            echo "$PACKAGE $VERSION is published and $TAG points to $TAG_SHA; nothing to do for $HEAD_SHA"
            exit 0
          fi
          # Not published, and tagged on an earlier commit of main: a run that tagged and then failed
          # to publish. Nothing went out under the tag, so it moves to the commit this run publishes.
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG_SHA...$HEAD_SHA" --jq .status)
          if [ "$STATUS" = "ahead" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$HEAD_SHA" -F force=true >/dev/null
            echo "moved tag $TAG from $TAG_SHA to $HEAD_SHA: $PACKAGE $VERSION was never published"
            exit 0
          fi
          echo "::error::$TAG already points to another commit ($TAG_SHA, expected $HEAD_SHA), which is not an ancestor of it. Re-run the release workflow for $TAG_SHA, or bump the version of packages/$PACKAGE and push again"
          exit 1

  build:
    name: Build the wheel and the sdist
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # No cache in a job whose output is published: what is built comes from the lockfile alone.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '22'
          cache: false
      - run: vp install --frozen-lockfile
      # The client is not in git: it is built here, into the package, before the package is.
      - name: Build the Studio client into the package
        run: vp run build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build the wheel and the sdist (uv build)
        run: uv build --package "$PACKAGE" --out-dir dist
      - name: Check that the wheel carries the client
        run: |
          set -euo pipefail
          python3 -c 'import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert "djangoer/studio/static/index.html" in names, "the wheel has no built client"' dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [plan, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/djangoer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [plan, tag, build]
    if: github.event_name == 'workflow_run' && needs.plan.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djangoer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # skip-existing: a re-run after a partial upload publishes only the files still missing.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  release:
    name: Create GitHub release
    needs: [plan, tag, publish-pypi]
    # After a publish, or when this version was on PyPI already (a re-run that only lacks the
    # release): the release is created once, from the tag, with the notes GitHub writes from the
    # pull requests since the last one.
    if: >-
      !cancelled() && github.event_name == 'workflow_run' &&
      needs.plan.result == 'success' && needs.tag.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; skip"
            exit 0
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
